<head>

  <meta name="theme-color" content="#d6c8fa">
  <!-- Vista previa al compartir el enlace (WhatsApp, Facebook, Instagram) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Sweetie &amp; Psycho">
  <meta property="og:title" content="Sweetie &amp; Psycho">
  <meta property="og:description" content="Venta de accesorios ✨ Hacemos envíos a todo Honduras 🇭🇳 Síguenos en Instagram: @sweetie.and.psycho">
  <meta property="og:url" content="https://clafigue8.github.io/Sweetieandpsycho-/">
  <meta property="og:image" content="https://clafigue8.github.io/Sweetieandpsycho-/assets/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="es_HN">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://clafigue8.github.io/Sweetieandpsycho-/assets/og-image.jpg">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link id="font-link" rel="stylesheet" href="">
  <link rel="stylesheet" href="assets/store.css?v=20261128a">
</head>
<body>
  <div id="announcement" class="announcement" hidden></div>

  <header class="site-header">
    <div class="header-left">
      <button class="icon-btn" id="menu-open" aria-label="Menú">
        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <a href="#/" class="brand" id="brand" aria-label="Inicio"></a>
    </div>
    <nav class="header-actions">
      <button class="icon-btn" id="search-toggle" aria-label="Buscar">
        <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn cart-btn" id="cart-open" aria-label="Carrito">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M6 7h12l-1 13H7L6 7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 7a3 3 0 016 0" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        <span class="cart-count" id="cart-count">0</span>
      </button>
    </nav>
  </header>

  <div class="search-bar" id="search-bar" hidden>
    <input type="search" id="search" placeholder="Buscar productos…" autocomplete="off">
  </div>

  <main id="app">
    <p class="loading">Cargando tienda…</p>
  </main>

  <footer class="site-footer" id="footer"></footer>

  <!-- Ficha de producto -->
  <div class="overlay" id="product-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" id="product-modal"></div>
  </div>

  <!-- Menú lateral -->
  <div class="overlay" id="menu-overlay" hidden>
    <aside class="drawer left" role="dialog" aria-modal="true" aria-label="Menú">
      <div class="drawer-head">
        <h2>Menú</h2>
        <button class="icon-btn" data-close="menu" aria-label="Cerrar">✕</button>
      </div>
      <nav class="side-nav" id="side-nav"></nav>
    </aside>
  </div>

  <!-- Opinión -->
  <div class="overlay" id="review-overlay" hidden>
    <div class="modal review-modal" role="dialog" aria-modal="true" aria-label="Escribir una opinión" id="review-modal"></div>
  </div>

  <!-- Carrito -->
  <div class="overlay" id="cart-overlay" hidden>
    <aside class="drawer" role="dialog" aria-modal="true" aria-label="Carrito">
      <div class="drawer-head">
        <h2>Tu carrito</h2>
        <button class="icon-btn" data-close="cart" aria-label="Cerrar">✕</button>
      </div>
      <div class="drawer-body" id="cart-body"></div>
      <div class="drawer-foot" id="cart-foot"></div>
    </aside>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="assets/store.js?v=20261128a"></script>
</body>
</html>
