name: Páginas para Google
on:
  push:
    branches: [main]
    paths: ["data/store.json", "index.html", "tools/build_seo.py", ".github/workflows/seo.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: seo
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar páginas, sitemap y robots
        run: python3 tools/build_seo.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html products collections sitemap.xml robots.txt 404.html
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Actualizar páginas para Google"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
